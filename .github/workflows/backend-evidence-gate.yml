name: Backend Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/npc-runtime/**"
      - "data/evidence/godot/**"
      - ".github/workflows/backend-evidence-gate.yml"

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: doo-arc-runner-set
    defaults:
      run:
        working-directory: backend/npc-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/npc-runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate backend and Godot Evidence Schema
        run: |
          npm run check
          node --import tsx --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { validateGodotEvidencePack, validateGodotObservationFrame } from "./src/godot/runtime-schema.ts";
          const shell = JSON.parse(await readFile("../../data/evidence/godot/shell/dre_171_shell_evidence.json", "utf8"));
          const runtime = JSON.parse(await readFile("../../data/evidence/godot/runtime-slice/dre_171_runtime_slice_evidence.json", "utf8"));
          const checks = [
            validateGodotEvidencePack(shell),
            validateGodotEvidencePack(runtime),
            validateGodotObservationFrame(runtime.observationFrame),
          ];
          const failed = checks.filter((check) => !check.ok);
          if (failed.length > 0) {
            console.error(JSON.stringify(failed, null, 2));
            process.exit(1);
          }
          console.log("Godot Evidence Packs validated.");
          NODE
