name: Backend Evidence Gate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: doo-arc-runner-set
    defaults:
      run:
        working-directory: backend/npc-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/npc-runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required gate artifacts
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const base = "../../data/evidence/ws8/gate-h";
          const required = [
            "run-a-evidence-pack.json",
            "run-b-evidence-pack.json",
            "run-c-evidence-pack.json",
            "run-a-regression-metrics.json",
            "run-b-regression-metrics.json",
            "run-c-regression-metrics.json",
            "run-a-events.json",
            "run-b-events.json",
            "run-c-events.json",
          ];
          const missing = required.filter((file) => !fs.existsSync(base + "/" + file));
          if (missing.length > 0) {
            console.error("Missing artifacts:\n" + missing.join("\n"));
            process.exit(1);
          }
          console.log("All required artifacts exist.");
          NODE

      - name: Validate per-run gate metrics
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const base = "../../data/evidence/ws8/gate-h";
          for (const run of ["a", "b", "c"]) {
            const evidencePath = base + "/run-" + run + "-evidence-pack.json";
            const metricsPath = base + "/run-" + run + "-regression-metrics.json";
            const evidence = JSON.parse(fs.readFileSync(evidencePath, "utf8"));
            const metrics = JSON.parse(fs.readFileSync(metricsPath, "utf8"));
            if (evidence.pass !== true) {
              throw new Error("run-" + run + " evidence pass=false");
            }
            if (Array.isArray(evidence.violations) && evidence.violations.length > 0) {
              throw new Error("run-" + run + " has violations");
            }
            if (metrics.pass?.all !== true) {
              throw new Error("run-" + run + " metrics pass.all=false");
            }
            if ((metrics.continuity?.codexReplyMissingThreadId ?? 1) !== 0) {
              throw new Error("run-" + run + " continuity codexReplyMissingThreadId != 0");
            }
            if (
              (metrics.fallbackPath?.missingReasonCode ?? 1) !== 0 ||
              (metrics.fallbackPath?.missingReasonCategory ?? 1) !== 0
            ) {
              throw new Error("run-" + run + " fallback path reason fields missing");
            }
            console.log("run-" + run + " metrics validated");
          }
          NODE

      - name: Verify trajectory diversity
        run: |
          mkdir -p ../../logs/ws8
          npm run ws8:trajectory:verify -- \
            --evidence ../../data/evidence/ws8/gate-h/run-a-evidence-pack.json \
            --evidence ../../data/evidence/ws8/gate-h/run-b-evidence-pack.json \
            --evidence ../../data/evidence/ws8/gate-h/run-c-evidence-pack.json \
            --out ../../logs/ws8/ci-trajectory-diversity.json \
            --min-runs 3 \
            --strict

      - name: Summarize gate output
        run: |
          node -e "const fs=require('node:fs');const p='../../logs/ws8/ci-trajectory-diversity.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));console.log('runCount='+j.totals.runCount+' uniqueTrajectorySignatures='+j.totals.uniqueTrajectorySignatures+' pass='+j.pass);"

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ws8-backend-evidence-gate
          path: |
            data/evidence/ws8/gate-h/*.json
            logs/ws8/ci-trajectory-diversity.json
