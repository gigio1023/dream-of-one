name: Backend Runtime Check

on:
  push:
    paths:
      - "backend/npc-runtime/**"
      - ".github/workflows/backend-runtime.yml"
  pull_request:
    paths:
      - "backend/npc-runtime/**"
      - ".github/workflows/backend-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-check:
    runs-on: doo-arc-runner-set
    defaults:
      run:
        working-directory: backend/npc-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backend conformance checks
        run: bun run check
